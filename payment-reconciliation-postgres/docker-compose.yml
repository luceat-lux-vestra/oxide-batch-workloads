services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: oxide_batch_workload
      POSTGRES_PASSWORD: oxide_batch_workload
      POSTGRES_DB: payment_reconciliation_workload
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxide_batch_workload -d payment_reconciliation_workload"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - payment_reconciliation_workload_data:/var/lib/postgresql

volumes:
  payment_reconciliation_workload_data:
