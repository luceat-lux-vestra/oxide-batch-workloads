[package]
name = "csv-postgres"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
description = "OxideBatch 0.6.0 real-workload validation: streaming CSV -> PostgreSQL restartable batch import"

[[bin]]
name = "csv-postgres"
path = "src/main.rs"

[dependencies]
oxide-batch = { version = "=0.6.0", features = ["postgres"] }
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
oxide-batch-test = "=0.6.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs"] }

[profile.dev]
opt-level = 0
