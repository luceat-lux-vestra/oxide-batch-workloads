services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: oxide_batch_workload
      POSTGRES_PASSWORD: oxide_batch_workload
      POSTGRES_DB: csv_postgres_workload
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxide_batch_workload -d csv_postgres_workload"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      # PostgreSQL 18's official image expects a single mount at
      # /var/lib/postgresql (not .../data): it now lays out data in a
      # pg_ctlcluster-style, major-version-specific subdirectory. Mounting
      # at .../data directly fails to start (confirmed against this exact
      # image: "PostgreSQL data in: /var/lib/postgresql/data (unused
      # mount/volume)").
      - csv_postgres_workload_data:/var/lib/postgresql

volumes:
  csv_postgres_workload_data:
