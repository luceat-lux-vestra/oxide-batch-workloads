[package]
name = "raw-sqlx"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "Apache-2.0"
description = "Raw Rust/sqlx semantic-parity baseline for postgres-postgres benchmark campaign #73"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
