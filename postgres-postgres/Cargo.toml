[workspace]
members = ["benchmark/raw-sqlx"]
resolver = "2"

[package]
name = "postgres-postgres"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
default-run = "postgres-postgres"
publish = false
license = "Apache-2.0"
description = "OxideBatch 0.6.0 real-workload validation: PostgreSQL -> PostgreSQL restartable batch transform (cursor and paging reader modes)"

[features]
default = []
allocator-jemalloc = ["dep:tikv-jemallocator"]
allocator-mimalloc = ["dep:mimalloc"]
allocator-snmalloc = ["dep:snmalloc-rs"]
allocator-tcmalloc = ["dep:tcmalloc-better"]
allocator-jemalloc-telemetry = ["allocator-jemalloc", "dep:tikv-jemalloc-sys", "tikv-jemallocator/stats", "tikv-jemalloc-sys/stats"]
allocator-mimalloc-telemetry = ["allocator-mimalloc", "mimalloc/extended"]
allocator-snmalloc-telemetry = ["allocator-snmalloc", "snmalloc-rs/stats"]

[lib]
name = "postgres_postgres"
path = "src/lib.rs"

[[bin]]
name = "postgres-postgres"
path = "src/main.rs"

[[bin]]
name = "postgres-postgres-endurancectl"
path = "src/bin/postgres-postgres-endurancectl.rs"

[dependencies]
oxide-batch = { version = "=0.6.0", features = ["postgres"] }
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
rand = "0.10"
rand_chacha = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
mimalloc = { version = "=0.1.52", optional = true }
snmalloc-rs = { version = "=0.7.6", optional = true }
tcmalloc-better = { version = "=0.1.19", optional = true }
tikv-jemalloc-sys = { version = "=0.7.1", default-features = false, optional = true }
tikv-jemallocator = { version = "=0.7.0", optional = true }


[profile.dev]
opt-level = 0
