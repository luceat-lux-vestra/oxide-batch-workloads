[package]
name = "postgres-postgres"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "Apache-2.0"
description = "OxideBatch 0.6.0 real-workload validation: PostgreSQL -> PostgreSQL cursor-mode restartable batch transform"

[lib]
name = "postgres_postgres"
path = "src/lib.rs"

[[bin]]
name = "postgres-postgres"
path = "src/main.rs"

[dependencies]
oxide-batch = { version = "=0.6.0", features = ["postgres"] }
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
rand = "0.10"
rand_chacha = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs"] }

[profile.dev]
opt-level = 0
