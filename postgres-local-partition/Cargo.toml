[package]
name = "postgres-local-partition"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "Apache-2.0"
description = "OxideBatch 0.6.0 external validation: PostgreSQL local-partition correctness and dense scaling"
default-run = "postgres-local-partition"

[[bin]]
name = "postgres-local-partition"
path = "src/main.rs"

[[bin]]
name = "postgres-local-partition-recoveryctl"
path = "src/bin/postgres-local-partition-recoveryctl.rs"

[dependencies]
oxide-batch = { version = "=0.6.0", features = ["postgres"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.dev]
opt-level = 0
