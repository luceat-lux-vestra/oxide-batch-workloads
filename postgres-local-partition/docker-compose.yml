services:
  postgres:
    image: postgres:18
    command: ["postgres", "-c", "max_connections=160"]
    environment:
      POSTGRES_USER: oxide_batch_workload
      POSTGRES_PASSWORD: oxide_batch_workload
      POSTGRES_DB: postgres_local_partition_workload
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxide_batch_workload -d postgres_local_partition_workload"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_local_partition_workload_data:/var/lib/postgresql

volumes:
  postgres_local_partition_workload_data:
