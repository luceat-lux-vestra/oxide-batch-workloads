openapi: 3.1.0
info:
  title: OxideBatch Payment Reference Canonical API
  version: 0.2.0
  description: >-
    Provider-neutral Merchant -> Gateway contract. Kill Bill, Hyperswitch and
    PG-native request/response shapes are intentionally excluded.
paths:
  /payments/authorize:
    post:
      operationId: authorizePayment
      requestBody:
        $ref: '#/components/requestBodies/PaymentMutation'
      responses:
        '200': { $ref: '#/components/responses/PaymentView' }
        '202': { $ref: '#/components/responses/PaymentView' }
        '409': { $ref: '#/components/responses/Conflict' }
  /payments/auth-capture:
    post:
      operationId: authCapturePayment
      requestBody:
        $ref: '#/components/requestBodies/PaymentMutation'
      responses:
        '200': { $ref: '#/components/responses/PaymentView' }
        '202': { $ref: '#/components/responses/PaymentView' }
        '409': { $ref: '#/components/responses/Conflict' }
  /payments/{paymentId}/capture:
    post:
      operationId: capturePayment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        $ref: '#/components/requestBodies/PaymentMutation'
      responses:
        '200': { $ref: '#/components/responses/PaymentView' }
        '202': { $ref: '#/components/responses/PaymentView' }
        '409': { $ref: '#/components/responses/Conflict' }
  /payments/{paymentId}/cancel:
    post:
      operationId: cancelPayment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        $ref: '#/components/requestBodies/PaymentMutation'
      responses:
        '200': { $ref: '#/components/responses/PaymentView' }
        '202': { $ref: '#/components/responses/PaymentView' }
        '409': { $ref: '#/components/responses/Conflict' }
  /payments/{paymentId}/refund:
    post:
      operationId: refundPayment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        $ref: '#/components/requestBodies/PaymentMutation'
      responses:
        '200': { $ref: '#/components/responses/PaymentView' }
        '202': { $ref: '#/components/responses/PaymentView' }
        '409': { $ref: '#/components/responses/Conflict' }
  /payments/{paymentId}:
    get:
      operationId: getPayment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200': { $ref: '#/components/responses/PaymentView' }
        '404':
          description: Payment is not known to the Gateway.
components:
  parameters:
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  requestBodies:
    PaymentMutation:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentMutation'
  responses:
    PaymentView:
      description: >-
        Canonical payment state. A newly accepted mutation may remain
        PAYMENT_PENDING/PENDING until the Billing integration checkpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentView'
    Conflict:
      description: Idempotency key or operation identity conflicts with a prior mutation.
  schemas:
    PaymentMutation:
      type: object
      additionalProperties: false
      required:
        - merchantId
        - merchantOrderId
        - merchantPaymentId
        - operationId
        - amountMinor
        - currency
        - idempotencyKey
      properties:
        merchantId: { type: string, minLength: 1 }
        merchantOrderId: { type: string, minLength: 1 }
        merchantPaymentId: { type: string, minLength: 1 }
        operationId: { type: string, minLength: 1 }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        paymentMethodToken:
          type: [string, 'null']
          description: Required by authorize/auth-capture, omitted for later operations.
        idempotencyKey: { type: string, minLength: 1 }
        requestedAt:
          type: [string, 'null']
          description: Optional caller timestamp; excluded from idempotency equivalence.
    ExternalPaymentMapping:
      type: object
      additionalProperties: false
      required:
        - merchantPaymentId
        - gatewayOperationId
      properties:
        merchantPaymentId: { type: string }
        gatewayOperationId: { type: string }
        killbillPaymentId: { type: [string, 'null'] }
        killbillTransactionId: { type: [string, 'null'] }
        hyperswitchPaymentId: { type: [string, 'null'] }
        hyperswitchAttemptId: { type: [string, 'null'] }
        providerPaymentId: { type: [string, 'null'] }
        providerOperationId: { type: [string, 'null'] }
        providerIdempotencyKey: { type: [string, 'null'] }
    PaymentView:
      type: object
      additionalProperties: false
      required:
        - merchantPaymentId
        - paymentState
        - lastOperationState
        - mapping
      properties:
        merchantPaymentId: { type: string }
        paymentState:
          type: string
          enum:
            - CREATED
            - PAYMENT_PENDING
            - AUTHORIZED
            - PARTIALLY_CAPTURED
            - PAID
            - CANCELLED
            - PARTIALLY_REFUNDED
            - REFUNDED
            - PAYMENT_FAILED
            - PAYMENT_UNKNOWN
        lastOperationState:
          type: string
          enum:
            - PENDING
            - SUCCEEDED
            - FAILED
            - UNKNOWN
            - RETRY_PENDING
            - MANUAL_REVIEW
        mapping:
          $ref: '#/components/schemas/ExternalPaymentMapping'
