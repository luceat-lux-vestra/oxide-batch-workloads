name: Temporary #311 payment-recovery evidence repair

on:
  push:
    branches:
      - issue-311-payment-recovery-evidence-provenance

permissions:
  contents: write

concurrency:
  group: issue-311-payment-recovery-evidence-repair
  cancel-in-progress: true

jobs:
  produce:
    if: github.repository == 'luceat-lux-vestra/oxide-batch-workloads'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      DATABASE_URL: postgresql://oxide_batch_workload:oxide_batch_workload@127.0.0.1:5437/payment_recovery_workload
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out exact repair producer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: payment-recovery-postgres

      - name: Produce fresh payment-recovery retained evidence
        working-directory: payment-recovery-postgres
        run: ./evidence/produce.sh

      - name: Commit generated retained-evidence candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add payment-recovery-postgres/validation
          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^payment-recovery-postgres/validation/'; then
            echo "::error::producer staged a path outside payment-recovery validation"
            exit 1
          fi
          git commit -m 'fix(evidence): refresh payment-recovery retained evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload generated retained-evidence repair candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payment-recovery-retained-evidence-311
          path: payment-recovery-postgres/validation
          if-no-files-found: error
          retention-days: 7
