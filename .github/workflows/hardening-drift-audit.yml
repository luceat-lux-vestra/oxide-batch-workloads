name: Repository hardening drift audit

on:
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "SECURITY.md"
      - "workloads.json"
      - "*/Cargo.toml"
      - "*/Cargo.lock"
      - "*/validation/**"
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:
    inputs:
      test_mode:
        description: Live audit or bounded synthetic lifecycle test
        required: true
        type: choice
        default: live
        options:
          - live
          - policy-drift
          - infrastructure-failure
          - clean

concurrency:
  group: hardening-drift-audit
  cancel-in-progress: false

permissions: {}

jobs:
  detect:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up current Go stable for actionlint
        id: install-go
        if: github.event_name != 'workflow_dispatch' || inputs.test_mode == 'live'
        continue-on-error: true
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Install maintained zizmor
        id: install-zizmor
        if: github.event_name != 'workflow_dispatch' || inputs.test_mode == 'live'
        continue-on-error: true
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: zizmor
          checksum: true
          fallback: none

      - name: Install maintained cargo-deny
        id: install-deny
        if: github.event_name != 'workflow_dispatch' || inputs.test_mode == 'live'
        continue-on-error: true
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
          checksum: true
          fallback: none

      - name: Run hardening drift audit
        id: audit
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANAGED_TOOL_OUTCOMES: ${{ steps.install-go.outcome }},${{ steps.install-zizmor.outcome }},${{ steps.install-deny.outcome }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'live' }}
        run: |
          python3 .github/scripts/run-hardening-drift-audit.py \
            --test-mode "$TEST_MODE" \
            --tool-install-status "$MANAGED_TOOL_OUTCOMES" \
            --output "${{ runner.temp }}/hardening-drift-audit.json"

      - name: Upload trusted audit result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hardening-drift-audit-result
          path: ${{ runner.temp }}/hardening-drift-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce audit result
        if: steps.audit.outcome != 'success'
        run: exit 1

  report:
    needs: detect
    if: always()
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out trusted repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download audit result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hardening-drift-audit-result
          path: ${{ runner.temp }}/audit-result

      - name: Reconcile owned audit issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/report-hardening-drift-audit.py \
            --result "${{ runner.temp }}/audit-result/hardening-drift-audit.json" \
            --run-url "$RUN_URL"
