name: Temporary PR76 untimed migration boundary

on:
  push:
    branches:
      - feat/73-raw-sqlx-paging

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # latest stable snapshot
        with:
          toolchain: stable
          components: rustfmt
      - name: Remove migration from timed run path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('postgres-postgres/benchmark/raw-sqlx/src/main.rs')
          s = p.read_text()
          needle = '    migrate(pool).await?;\n    let mut source_guard = lock_source(pool).await?;'
          replacement = '    let mut source_guard = lock_source(pool).await?;'
          if s.count(needle) != 1:
              raise SystemExit(f'expected exactly one run-path migrate call, found {s.count(needle)}')
          s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY
          cd postgres-postgres
          cargo fmt --all
          cargo test -p raw-sqlx --locked
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git diff --check
          git add postgres-postgres/benchmark/raw-sqlx/src/main.rs
          git commit -m "fix(raw-sqlx): keep migration outside the run path"
          git push
