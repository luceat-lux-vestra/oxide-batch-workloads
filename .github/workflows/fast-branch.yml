name: Fast branch CI

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: pr302-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: postgres-postgres-cargo-lock-refresh
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # latest stable snapshot
        with:
          toolchain: stable

      - name: Refresh postgres-postgres Cargo.lock through full resolver authority
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-cargo-locks.py refresh --name postgres-postgres
          python3 .github/scripts/validate-cargo-locks.py check --name postgres-postgres
          git diff --check -- postgres-postgres/Cargo.lock
          git diff -- postgres-postgres/Cargo.lock > "$RUNNER_TEMP/Cargo.lock.diff"
          sha256sum postgres-postgres/Cargo.toml postgres-postgres/Cargo.lock > "$RUNNER_TEMP/sha256.txt"
          {
            printf 'head_sha=%s\n' "$GITHUB_SHA"
            cargo --version
            rustc --version
          } > "$RUNNER_TEMP/toolchain.txt"

      - name: Upload Cargo-generated lock evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr302-postgres-postgres-full-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            postgres-postgres/Cargo.toml
            postgres-postgres/Cargo.lock
            ${{ runner.temp }}/Cargo.lock.diff
            ${{ runner.temp }}/sha256.txt
            ${{ runner.temp }}/toolchain.txt
          if-no-files-found: error
          retention-days: 7
