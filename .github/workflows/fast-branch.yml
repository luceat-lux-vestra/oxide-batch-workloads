name: Fast branch CI

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: fast-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # latest stable snapshot
        with:
          toolchain: stable

      - name: Cache representative workload
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: csv-postgres

      - name: Test fail-closed workload registry validation
        run: python3 .github/scripts/test-workload-registry.py

      - name: Validate canonical workload registry
        run: python3 .github/scripts/validate-workload-registry.py

      - name: Compile representative real workload
        working-directory: csv-postgres
        run: cargo check --locked --all-targets
