name: Fast branch CI

on:
  push:
    branches:
      - tmp/307-procfs-race-preflight

permissions:
  contents: write

concurrency:
  group: pr307-procfs-race-preflight
  cancel-in-progress: true

jobs:
  focused:
    name: pr307-procfs-race-preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: postgres-postgres
    env:
      DATABASE_URL: postgresql://oxide_batch_workload:oxide_batch_workload@localhost:5434/postgres_postgres_workload
      POSTGRES_POSTGRES_TEST_DATABASE_URL: postgresql://oxide_batch_workload:oxide_batch_workload@localhost:5434/postgres_postgres_workload
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # latest stable snapshot
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Canonically format repair
        run: |
          set -euo pipefail
          cargo fmt --all
          mapfile -t changed < <(git -C "$GITHUB_WORKSPACE" diff --name-only)
          for path in "${changed[@]}"; do
            if [[ "$path" != "postgres-postgres/src/endurance/sampling.rs" ]]; then
              echo "::error::rustfmt unexpectedly changed: $path" >&2
              git -C "$GITHUB_WORKSPACE" diff -- "$path" >&2 || true
              exit 1
            fi
          done
          cargo fmt --check --all

      - name: Compile all postgres-postgres tests
        run: cargo check --locked -p postgres-postgres --tests

      - name: Run procfs classifier and parser unit contracts
        run: cargo test --locked -p postgres-postgres --lib procfs_parser_tests -- --nocapture

      - name: Start PostgreSQL
        run: docker compose up -d --wait --wait-timeout 60

      - name: Run complete Slice E integration contract
        run: cargo test --locked -p postgres-postgres --test endurance_slice_e -- --test-threads=1 --nocapture

      - name: Stress clean-sample process-exit race
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            echo "race stress attempt $attempt/10"
            cargo test --locked -p postgres-postgres --test endurance_slice_e \
              sampled_clean_iterations_append_measurements_and_stop_after_return \
              -- --exact --test-threads=1 --nocapture
          done

      - name: Lint library and tests
        run: cargo clippy --locked -p postgres-postgres --lib --tests -- -D warnings

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes

      - name: Materialize exact rustfmt output after all checks pass
        if: success()
        run: |
          set -euo pipefail
          if git -C "$GITHUB_WORKSPACE" diff --quiet -- postgres-postgres/src/endurance/sampling.rs; then
            echo "rustfmt produced no repository diff"
            exit 0
          fi
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add postgres-postgres/src/endurance/sampling.rs
          git -C "$GITHUB_WORKSPACE" commit -m "style(profile): materialize procfs race repair [skip ci]"
          git -C "$GITHUB_WORKSPACE" push origin "HEAD:${GITHUB_REF_NAME}"
