name: Temporary PR76 raw-sqlx CLI fix

on:
  push:
    branches:
      - feat/73-raw-sqlx-paging

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # latest stable snapshot
        with:
          toolchain: stable
          components: rustfmt
      - name: Fix CLI contract and add regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('postgres-postgres/benchmark/raw-sqlx/src/main.rs')
          s = p.read_text()

          old_arg = '#[arg(long, env = "DATABASE_URL", global = true)]'
          new_arg = '#[arg(long, env = "DATABASE_URL")]'
          if s.count(old_arg) != 1:
              raise SystemExit(f'expected one global database_url arg, found {s.count(old_arg)}')
          s = s.replace(old_arg, new_arg, 1)

          marker = '''    #[test]\n    fn writer_bound_matches_oxide_batch_060_contract() {\n'''
          test = '''    #[test]\n    fn cli_accepts_required_database_url_before_subcommand() {\n        let parsed = Cli::try_parse_from([\n            "raw-sqlx",\n            "--database-url",\n            "postgres://postgres:postgres@localhost:5432/postgres",\n            "migrate",\n        ]);\n        assert!(parsed.is_ok());\n    }\n\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'expected one test insertion marker, found {s.count(marker)}')
          s = s.replace(marker, test + marker, 1)
          p.write_text(s)
          PY
          cd postgres-postgres
          cargo fmt --all
          cargo test -p raw-sqlx --locked
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git diff --check
          git add postgres-postgres/benchmark/raw-sqlx/src/main.rs
          git commit -m "fix(raw-sqlx): make database URL a valid required CLI option"
          git push
