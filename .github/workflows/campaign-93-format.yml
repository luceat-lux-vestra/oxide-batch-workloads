name: Campaign 93 scratch format

on:
  push:
    branches: [campaign-93-lockgen]
    paths:
      - postgres-local-partition/src/**
      - .github/workflows/campaign-93-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out scratch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Apply rustfmt
        run: cargo fmt --manifest-path postgres-local-partition/Cargo.toml

      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add postgres-local-partition/src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format campaign 93 scratch code"
          git push
