name: Campaign 93 scratch format

on:
  push:
    branches: [campaign-93-lockgen]
    paths:
      - postgres-local-partition/src/**
      - .github/workflows/campaign-93-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out scratch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Pin source identity across dense worker points
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('postgres-local-partition/src/main.rs')
          text = path.read_text()
          anchor = '    let mut baseline: Option<NormalizedDurableState> = None;\n'
          prefix = (
              '    let identity_pool = app_pool(url, 1).await?;\n'
              '    let (baseline_source_rows, baseline_source_digest) = source_identity(&identity_pool).await?;\n'
              '    identity_pool.close().await;\n'
              '    if baseline_source_rows != rows {\n'
              '        bail!("source contains {baseline_source_rows} rows, expected {rows}");\n'
              '    }\n\n'
          )
          if 'baseline_source_digest' not in text:
              if anchor not in text:
                  raise SystemExit('baseline anchor not found')
              text = text.replace(anchor, prefix + anchor, 1)
          check_anchor = '        if let Some(expected) = &baseline {\n'
          check = (
              '        if verification.business.source_digest != baseline_source_digest {\n'
              '            bail!("source identity changed before or during the {workers}-worker point");\n'
              '        }\n'
          )
          if 'source identity changed before or during' not in text:
              if check_anchor not in text:
                  raise SystemExit('per-point baseline anchor not found')
              text = text.replace(check_anchor, check + check_anchor, 1)
          path.write_text(text)
          PY

      - name: Apply rustfmt
        run: cargo fmt --manifest-path postgres-local-partition/Cargo.toml

      - name: Commit patch if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add postgres-local-partition/src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: pin source identity across dense points"
          git push
