name: Campaign 93 scratch format

on:
  push:
    branches: [campaign-93-lockgen]
    paths:
      - postgres-local-partition/src/**
      - .github/workflows/campaign-93-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out scratch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Apply clippy fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('postgres-local-partition/src/main.rs')
          text = path.read_text()
          marker = 'fn build_job(\n'
          replacement = (
              '// This construction boundary intentionally keeps every restart-relevant and\\n'
              '// resource-relevant input explicit; hiding them in an unvalidated options bag\\n'
              '// would make the workload contract harder to audit.\\n'
              '#[allow(clippy::too_many_arguments)]\\n'
              'fn build_job(\\n'
          ).replace('\\n', '\n')
          if '#[allow(clippy::too_many_arguments)]\nfn build_job(' not in text:
              if marker not in text:
                  raise SystemExit('build_job marker not found')
              text = text.replace(marker, replacement, 1)
          old = 'if rows % u64::from(partitions) != 0 {'
          new = 'if !rows.is_multiple_of(u64::from(partitions)) {'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('divisibility expression not found')
          path.write_text(text)
          PY

      - name: Apply rustfmt
        run: cargo fmt --manifest-path postgres-local-partition/Cargo.toml

      - name: Commit patch if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add postgres-local-partition/src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: satisfy strict clippy validation"
          git push
