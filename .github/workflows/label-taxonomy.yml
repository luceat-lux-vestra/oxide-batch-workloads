name: Label taxonomy

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/labels.json"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".github/scripts/validate-label-taxonomy.py"
      - ".github/scripts/test-label-taxonomy.py"
      - ".github/workflows/label-taxonomy.yml"
  push:
    branches: [main]
    paths:
      - ".github/labels.json"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".github/scripts/validate-label-taxonomy.py"
      - ".github/scripts/test-label-taxonomy.py"
      - ".github/workflows/label-taxonomy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: label-taxonomy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test taxonomy invariants
        run: python3 .github/scripts/test-label-taxonomy.py

      - name: Validate taxonomy and repository references
        run: python3 .github/scripts/validate-label-taxonomy.py
