name: JBeret clean qualification

on:
  pull_request:
    paths:
      - "postgres-postgres/benchmark/java/**"
      - "postgres-postgres/ci/validate-jberet-clean"
      - "postgres-postgres/ci/validate-supply-chain"
      - ".github/workflows/jberet-clean.yml"
permissions:
  contents: read

concurrency:
  group: jberet-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean:
    name: jberet-clean
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    defaults:
      run:
        working-directory: postgres-postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup native ARM Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Select Java 25
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          [[ -n "${JAVA_HOME:-}" && -x "$JAVA_HOME/bin/java" ]] || { echo "::error::setup-java did not provide ARM Java 25"; exit 1; }
          export PATH="$JAVA_HOME/bin:$PATH"
          [[ -z "${JAVA_TOOL_OPTIONS:-}" && -z "${_JAVA_OPTIONS:-}" && -z "${JDK_JAVA_OPTIONS:-}" ]] || { echo "::error::ambient JVM tuning flags are forbidden"; exit 1; }
          java_major="$(java -version 2>&1 | sed -n '1s/.* version "\([0-9][0-9]*\).*/\1/p')"
          [[ "$java_major" == "25" ]] || { echo "::error::expected Java 25, got ${java_major:-unknown}"; exit 1; }
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          java -version
          javac -version
          mvn -version

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # latest stable snapshot
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: postgres-postgres

      - name: Run bounded JBeret clean qualification
        run: ./ci/validate-jberet-clean
