name: Regenerate rand migration lockfile

on:
  push:
    branches: [deps/rand-0.10-migration]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot

      - name: Regenerate lockfile
        working-directory: csv-postgres
        run: cargo generate-lockfile

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- csv-postgres/Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add csv-postgres/Cargo.lock
          git commit -m "chore: regenerate lockfile for rand migration"
          git push origin HEAD:deps/rand-0.10-migration
