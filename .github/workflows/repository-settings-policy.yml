name: Repository settings policy

on:
  push:
    branches: [main]
    paths:
      - ".github/repository-settings-policy.json"
      - ".github/scripts/test-repository-settings-policy.py"
      - ".github/workflows/repository-settings-policy.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/repository-settings-policy.json"
      - ".github/scripts/test-repository-settings-policy.py"
      - ".github/workflows/repository-settings-policy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: repository-settings-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy-contract:
    name: repository-settings-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test repository settings policy contract
        run: python3 .github/scripts/test-repository-settings-policy.py
