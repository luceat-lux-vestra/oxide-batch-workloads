name: Benchmark OxideBatch CSV PostgreSQL

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Deterministic CSV row count
        required: true
        default: "100000"
      seed:
        description: Deterministic dataset seed
        required: true
        default: "42"
      chunk_size:
        description: OxideBatch chunk size
        required: true
        default: "500"
      warmups:
        description: Warmup executions
        required: true
        default: "2"
      measured_runs:
        description: Measured executions
        required: true
        default: "5"

permissions:
  contents: read

concurrency:
  group: benchmark-oxide-csv-postgres-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: oxide-csv-postgres-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://oxide_batch_workload:oxide_batch_workload@localhost:5433/csv_postgres_workload
      RUST_LOG: error
      BENCH_ROWS: ${{ inputs.rows }}
      BENCH_SEED: ${{ inputs.seed }}
      BENCH_CHUNK_SIZE: ${{ inputs.chunk_size }}
      BENCH_WARMUPS: ${{ inputs.warmups }}
      BENCH_MEASURED_RUNS: ${{ inputs.measured_runs }}
    defaults:
      run:
        working-directory: csv-postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # latest stable snapshot
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: csv-postgres

      - name: Validate benchmark harness
        run: python3 benchmark/test_baseline.py

      - name: Validate numeric inputs
        shell: bash
        run: |
          set -euo pipefail
          for value in "$BENCH_ROWS" "$BENCH_SEED" "$BENCH_CHUNK_SIZE" "$BENCH_WARMUPS" "$BENCH_MEASURED_RUNS"; do
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "::error::benchmark inputs must be non-negative integers"; exit 1; }
          done
          (( BENCH_ROWS > 0 )) || { echo "::error::rows must be > 0"; exit 1; }
          (( BENCH_CHUNK_SIZE > 0 )) || { echo "::error::chunk_size must be > 0"; exit 1; }
          (( BENCH_MEASURED_RUNS > 0 )) || { echo "::error::measured_runs must be > 0"; exit 1; }

      - name: Build release workload once
        run: cargo build --locked --release

      - name: Start PostgreSQL
        run: docker compose up -d --wait --wait-timeout 60

      - name: Migrate database
        run: target/release/csv-postgres migrate --database-url "$DATABASE_URL"

      - name: Generate deterministic dataset
        run: |
          target/release/csv-postgres generate \
            --output /tmp/oxide-baseline.csv \
            --rows "$BENCH_ROWS" \
            --seed "$BENCH_SEED"

      - name: Run baseline campaign
        id: campaign
        continue-on-error: true
        run: |
          python3 benchmark/baseline.py \
            --binary "$(pwd)/target/release/csv-postgres" \
            --input /tmp/oxide-baseline.csv \
            --database-url "$DATABASE_URL" \
            --rows "$BENCH_ROWS" \
            --seed "$BENCH_SEED" \
            --chunk-size "$BENCH_CHUNK_SIZE" \
            --warmups "$BENCH_WARMUPS" \
            --measured-runs "$BENCH_MEASURED_RUNS" \
            --output "$RUNNER_TEMP/oxide-csv-postgres-baseline.json"

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxide-csv-postgres-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oxide-csv-postgres-baseline.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes

      - name: Fail if campaign failed
        if: steps.campaign.outcome != 'success'
        run: |
          echo "::error::baseline campaign failed; inspect retained artifact"
          exit 1