name: Scheduled supply-chain audit policy

on:
  pull_request:
    branches: [main]
    paths:
      - "deny.toml"
      - "workloads.json"
      - ".github/labels.json"
      - ".github/scripts/discover-supply-chain-workloads.py"
      - ".github/scripts/validate-supply-chain.py"
      - ".github/scripts/run-scheduled-supply-chain-audit.py"
      - ".github/scripts/report-supply-chain-audit.py"
      - ".github/scripts/test-scheduled-supply-chain-audit.py"
      - ".github/workflows/scheduled-supply-chain-audit.yml"
      - ".github/workflows/scheduled-supply-chain-audit-policy.yml"
  push:
    branches: [main]
    paths:
      - "deny.toml"
      - "workloads.json"
      - ".github/labels.json"
      - ".github/scripts/discover-supply-chain-workloads.py"
      - ".github/scripts/validate-supply-chain.py"
      - ".github/scripts/run-scheduled-supply-chain-audit.py"
      - ".github/scripts/report-supply-chain-audit.py"
      - ".github/scripts/test-scheduled-supply-chain-audit.py"
      - ".github/workflows/scheduled-supply-chain-audit.yml"
      - ".github/workflows/scheduled-supply-chain-audit-policy.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: scheduled-supply-chain-audit-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test scheduled audit classification and issue lifecycle
        run: python3 .github/scripts/test-scheduled-supply-chain-audit.py
