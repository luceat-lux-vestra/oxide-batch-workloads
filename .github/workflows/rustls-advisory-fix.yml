name: Rustls advisory remediation

on:
  push:
    branches:
      - security/rustls-0.23.45

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Update only rustls
        run: |
          set -euo pipefail
          cargo update --manifest-path csv-postgres/Cargo.toml -p rustls --precise 0.23.45
          cargo update --manifest-path postgres-local-partition/Cargo.toml -p rustls --precise 0.23.45
          cargo update --manifest-path postgres-postgres/Cargo.toml -p rustls --precise 0.23.45

      - name: Prove lockfile delta is rustls-only
        run: |
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          lockfiles = [
              'csv-postgres/Cargo.lock',
              'postgres-local-partition/Cargo.lock',
              'postgres-postgres/Cargo.lock',
          ]

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD', '--', *lockfiles], text=True
          ).splitlines()
          if changed != lockfiles:
              raise SystemExit(f'unexpected lockfile change set: {changed!r}')

          def packages(raw: bytes):
              data = tomllib.loads(raw.decode('utf-8'))
              return data.get('package', [])

          for path in lockfiles:
              before = packages(subprocess.check_output(['git', 'show', f'HEAD:{path}']))
              after = packages(Path(path).read_bytes())
              before_by_id = {(p['name'], p['version'], p.get('source')): p for p in before}
              after_by_id = {(p['name'], p['version'], p.get('source')): p for p in after}

              old_rustls = [p for p in before if p['name'] == 'rustls']
              new_rustls = [p for p in after if p['name'] == 'rustls']
              if len(old_rustls) != 1 or len(new_rustls) != 1:
                  raise SystemExit(f'{path}: expected exactly one rustls package')
              old = old_rustls[0]
              new = new_rustls[0]
              if old['version'] not in {'0.23.43', '0.23.44'}:
                  raise SystemExit(f"{path}: unexpected old rustls version {old['version']}")
              if new['version'] != '0.23.45':
                  raise SystemExit(f"{path}: rustls did not update to 0.23.45: {new['version']}")

              old_shape = {k: v for k, v in old.items() if k not in {'version', 'checksum'}}
              new_shape = {k: v for k, v in new.items() if k not in {'version', 'checksum'}}
              if old_shape != new_shape:
                  raise SystemExit(f'{path}: rustls dependency/source shape changed unexpectedly')

              before_non = sorted(
                  (k, v) for k, v in before_by_id.items() if k[0] != 'rustls'
              )
              after_non = sorted(
                  (k, v) for k, v in after_by_id.items() if k[0] != 'rustls'
              )
              if before_non != after_non:
                  raise SystemExit(f'{path}: package other than rustls changed')

              print(f'{path}: rustls {old["version"]} -> {new["version"]}; all other packages identical')
          PY

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version '=0.20.2' --locked

      - name: Verify repository supply-chain policy
        run: |
          set -euo pipefail
          python3 .github/scripts/test-validate-supply-chain.py
          python3 .github/scripts/test-supply-chain-policy.py
          git diff --check

      - name: Commit minimal remediation and remove bootstrap
        run: |
          set -euo pipefail
          rm .github/workflows/rustls-advisory-fix.yml
          actual=$(git diff --name-only HEAD | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/rustls-advisory-fix.yml' \
            'csv-postgres/Cargo.lock' \
            'postgres-local-partition/Cargo.lock' \
            'postgres-postgres/Cargo.lock' | sort)
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(deps): update rustls to 0.23.45'
          git push origin HEAD:security/rustls-0.23.45
