name: Temporary PR76 checkpoint refactor

on:
  push:
    branches:
      - feat/73-raw-sqlx-paging

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # latest stable snapshot
        with:
          toolchain: stable
          components: rustfmt
      - name: Refactor commit state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('postgres-postgres/benchmark/raw-sqlx/src/main.rs')
          s = p.read_text()

          marker = '''struct ProjectedRow {
              import_name: String,
              source_digest: String,
              customer_id: i64,
              display_name: String,
              loyalty_score: i64,
              is_premium: bool,
              row_fingerprint: [u8; FINGERPRINT_LEN],
          }
          '''
          replacement = marker + '''
          #[derive(Debug, Clone, Copy)]
          struct CheckpointUpdate {
              last_customer_id: i64,
              committed_chunks: u64,
              committed_rows: u64,
          }
          '''
          if marker not in s:
              raise SystemExit('ProjectedRow marker not found')
          s = s.replace(marker, replacement, 1)

          call_inner = '''                    chunk_last,
                              committed_chunks + 1,
                              committed_rows + chunk.len() as u64,
                              fail_after_chunk,
          '''
          call_outer = '''            chunk_last,
                      committed_chunks + 1,
                      committed_rows + chunk.len() as u64,
                      fail_after_chunk,
          '''
          replacement_inner = '''                    CheckpointUpdate {
                                  last_customer_id: chunk_last,
                                  committed_chunks: committed_chunks + 1,
                                  committed_rows: committed_rows + chunk.len() as u64,
                              },
                              fail_after_chunk,
          '''
          replacement_outer = '''            CheckpointUpdate {
                          last_customer_id: chunk_last,
                          committed_chunks: committed_chunks + 1,
                          committed_rows: committed_rows + chunk.len() as u64,
                      },
                      fail_after_chunk,
          '''
          if s.count(call_inner) != 1 or s.count(call_outer) != 1:
              raise SystemExit(
                  f'expected one inner/outer call; got {s.count(call_inner)}/{s.count(call_outer)}'
              )
          s = s.replace(call_inner, replacement_inner, 1)
          s = s.replace(call_outer, replacement_outer, 1)

          old_sig = '''    chunk: &[ProjectedRow],
              last_customer_id: i64,
              committed_chunks: u64,
              committed_rows: u64,
              fail_after_chunk: Option<u64>,
          '''
          new_sig = '''    chunk: &[ProjectedRow],
              checkpoint: CheckpointUpdate,
              fail_after_chunk: Option<u64>,
          '''
          if old_sig not in s:
              raise SystemExit('commit_chunk signature fragment not found')
          s = s.replace(old_sig, new_sig, 1)

          old_condition = 'if fail_after_chunk == Some(committed_chunks) {'
          new_condition = 'if fail_after_chunk == Some(checkpoint.committed_chunks) {'
          old_bail = 'bail!("injected failure after business writes before checkpoint/commit at chunk {committed_chunks}");'
          new_bail = 'bail!("injected failure after business writes before checkpoint/commit at chunk {}", checkpoint.committed_chunks);'
          if s.count(old_condition) != 1 or s.count(old_bail) != 1:
              raise SystemExit(
                  f'expected one condition/bail; got {s.count(old_condition)}/{s.count(old_bail)}'
              )
          s = s.replace(old_condition, new_condition, 1)
          s = s.replace(old_bail, new_bail, 1)

          old_binds = '''    .bind(last_customer_id)
              .bind(i64::try_from(committed_chunks)?)
              .bind(i64::try_from(committed_rows)?)
          '''
          new_binds = '''    .bind(checkpoint.last_customer_id)
              .bind(i64::try_from(checkpoint.committed_chunks)?)
              .bind(i64::try_from(checkpoint.committed_rows)?)
          '''
          if old_binds not in s:
              raise SystemExit('checkpoint bind fragment not found')
          s = s.replace(old_binds, new_binds, 1)

          p.write_text(s)
          PY
          cd postgres-postgres
          cargo fmt --all
      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git diff --check
          git add postgres-postgres
          git commit -m "refactor(raw-sqlx): group checkpoint commit state"
          git push
