name: Temporary #271 rustfmt materializer

on:
  push:
    branches:
      - issue-271-payment-recovery-scaffold

permissions:
  contents: read

jobs:
  format:
    if: github.repository == 'luceat-lux-vestra/oxide-batch-workloads'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt
      - name: Materialize rustfmt output
        working-directory: payment-recovery-postgres
        run: cargo fmt
      - name: Upload formatted source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payment-recovery-rustfmt
          path: payment-recovery-postgres/src
          if-no-files-found: error
          retention-days: 1
