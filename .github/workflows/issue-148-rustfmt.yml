name: Temporary #148 rustfmt

on:
  push:
    branches:
      - issue-148-payment-reconciliation-scaffold

permissions:
  contents: write

concurrency:
  group: issue-148-rustfmt
  cancel-in-progress: true

jobs:
  format:
    if: github.repository == 'luceat-lux-vestra/oxide-batch-workloads'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-148-payment-reconciliation-scaffold
          fetch-depth: 0

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply rustfmt and commit only formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path payment-reconciliation-postgres/Cargo.toml
          if git diff --quiet -- payment-reconciliation-postgres; then
            echo "no formatting changes required"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payment-reconciliation-postgres
          git commit -m "style(payment-reconciliation): apply rustfmt (#148)"
          git push origin HEAD:issue-148-payment-reconciliation-scaffold
