name: Benchmark PostgreSQL four-way attribution

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Deterministic source row count
        required: true
        default: "1000000"
      seed:
        description: Deterministic source seed
        required: true
        default: "20260904"
      chunk_size:
        description: Shared chunk size
        required: true
        default: "1000"
      cursor_fetch_size:
        description: Shared cursor fetch size
        required: true
        default: "500"
      paging_page_size:
        description: Shared paging page size
        required: true
        default: "750"
      warmups:
        description: Warmup rounds per reader mode
        required: true
        default: "2"
      measured_runs:
        description: Measured four-candidate rounds per reader mode; must be divisible by four
        required: true
        default: "8"

permissions:
  contents: read

concurrency:
  group: benchmark-postgres-postgres-four-way-${{ github.ref }}
  cancel-in-progress: false

jobs:
  four-way:
    name: postgres-postgres-four-way
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      DATABASE_URL: postgresql://oxide_batch_workload:oxide_batch_workload@localhost:5434/postgres_postgres_workload
      RUST_LOG: error
      BENCH_ROWS: ${{ inputs.rows }}
      BENCH_SEED: ${{ inputs.seed }}
      BENCH_CHUNK_SIZE: ${{ inputs.chunk_size }}
      BENCH_CURSOR_FETCH_SIZE: ${{ inputs.cursor_fetch_size }}
      BENCH_PAGING_PAGE_SIZE: ${{ inputs.paging_page_size }}
      BENCH_WARMUPS: ${{ inputs.warmups }}
      BENCH_MEASURED_RUNS: ${{ inputs.measured_runs }}
    defaults:
      run:
        working-directory: postgres-postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select runner Java 21 and freeze JVM environment
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${JAVA_HOME_21_X64:-}" && -x "$JAVA_HOME_21_X64/bin/java" ]] || { echo "::error::runner Java 21 is unavailable"; exit 1; }
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          [[ -z "${JAVA_TOOL_OPTIONS:-}" && -z "${_JAVA_OPTIONS:-}" && -z "${JDK_JAVA_OPTIONS:-}" ]] || { echo "::error::ambient JVM tuning flags are forbidden"; exit 1; }
          java_major="$(java -version 2>&1 | sed -n '1s/.* version "\([0-9][0-9]*\).*/\1/p')"
          [[ "$java_major" == "21" ]] || { echo "::error::expected Java 21, got ${java_major:-unknown}"; exit 1; }
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          java -version
          javac -version
          mvn -version
          java -XX:+PrintCommandLineFlags -version

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # latest stable snapshot
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: postgres-postgres

      - name: Validate four-way harness and bounded inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmark/test_four_way.py
          python3 benchmark/java/ci/test-validate-raw-jdbc-crash.py
          python3 benchmark/java/ci/validate-raw-jdbc-crash.py
          for value in "$BENCH_ROWS" "$BENCH_SEED" "$BENCH_CHUNK_SIZE" "$BENCH_CURSOR_FETCH_SIZE" "$BENCH_PAGING_PAGE_SIZE" "$BENCH_WARMUPS" "$BENCH_MEASURED_RUNS"; do
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "::error::benchmark inputs must be non-negative integers"; exit 1; }
          done
          (( BENCH_ROWS >= 1 && BENCH_ROWS <= 10000000 )) || { echo "::error::rows out of range"; exit 1; }
          (( BENCH_CHUNK_SIZE >= 1 && BENCH_CHUNK_SIZE <= 1000000 )) || { echo "::error::chunk size out of range"; exit 1; }
          (( BENCH_CURSOR_FETCH_SIZE >= 1 && BENCH_CURSOR_FETCH_SIZE <= 1000000 )) || { echo "::error::cursor fetch size out of range"; exit 1; }
          (( BENCH_PAGING_PAGE_SIZE >= 1 && BENCH_PAGING_PAGE_SIZE <= 1000000 )) || { echo "::error::paging page size out of range"; exit 1; }
          (( BENCH_WARMUPS <= 10 )) || { echo "::error::warmups out of range"; exit 1; }
          (( BENCH_MEASURED_RUNS >= 4 && BENCH_MEASURED_RUNS <= 20 && BENCH_MEASURED_RUNS % 4 == 0 )) || { echo "::error::measured runs must be 4..20 and divisible by four"; exit 1; }
          total_chunks=$(( (BENCH_ROWS + BENCH_CHUNK_SIZE - 1) / BENCH_CHUNK_SIZE ))
          (( total_chunks >= 4 )) || { echo "::error::configuration must yield at least four chunks"; exit 1; }

      - name: Build all four candidates once
        run: |
          set -euo pipefail
          cargo build --locked --release --workspace
          mvn -B -ntp -f benchmark/java/pom.xml verify
          mkdir -p "$RUNNER_TEMP/benchmark-launcher"
          javac -d "$RUNNER_TEMP/benchmark-launcher" benchmark/java/ci/BenchmarkLauncher.java
          mvn -B -ntp -f benchmark/java/raw-jdbc/pom.xml \
            org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree \
            -Dscope=runtime -DoutputFile="$RUNNER_TEMP/raw-jdbc-dependency-tree.txt"
          mvn -B -ntp -f benchmark/java/spring-batch/pom.xml \
            org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree \
            -Dscope=runtime -DoutputFile="$RUNNER_TEMP/spring-dependency-tree.txt"

      - name: Start PostgreSQL 18
        run: docker compose up -d --wait --wait-timeout 60

      - name: Run four-way canonical campaign
        id: campaign
        continue-on-error: true
        run: |
          set +e
          python3 benchmark/four_way.py \
            --oxide-binary "$(pwd)/target/release/postgres-postgres" \
            --raw-rust-binary "$(pwd)/target/release/raw-sqlx" \
            --launcher-classes "$RUNNER_TEMP/benchmark-launcher" \
            --launcher-class "$RUNNER_TEMP/benchmark-launcher/io/oxidebatch/workloads/postgres/benchmark/ci/BenchmarkLauncher.class" \
            --raw-java-classpath "$(pwd)/benchmark/java/raw-jdbc/target/raw-jdbc-0.1.0.jar:$(pwd)/benchmark/java/raw-jdbc/target/dependency/*" \
            --spring-classpath "$(pwd)/benchmark/java/spring-batch/target/spring-batch-0.1.0.jar:$(pwd)/benchmark/java/spring-batch/target/dependency/*" \
            --raw-java-jar "$(pwd)/benchmark/java/raw-jdbc/target/raw-jdbc-0.1.0.jar" \
            --spring-jar "$(pwd)/benchmark/java/spring-batch/target/spring-batch-0.1.0.jar" \
            --raw-java-dependency-tree "$RUNNER_TEMP/raw-jdbc-dependency-tree.txt" \
            --spring-dependency-tree "$RUNNER_TEMP/spring-dependency-tree.txt" \
            --base-database-url "$DATABASE_URL" \
            --rows "$BENCH_ROWS" --seed "$BENCH_SEED" --chunk-size "$BENCH_CHUNK_SIZE" \
            --fetch-size "$BENCH_CURSOR_FETCH_SIZE" --page-size "$BENCH_PAGING_PAGE_SIZE" \
            --warmups "$BENCH_WARMUPS" --measured-runs "$BENCH_MEASURED_RUNS" \
            --output "$RUNNER_TEMP/postgres-postgres-four-way.json"
          status=$?
          if [[ -f "$RUNNER_TEMP/postgres-postgres-four-way.json" ]]; then
            sha256sum "$RUNNER_TEMP/postgres-postgres-four-way.json" | tee "$RUNNER_TEMP/postgres-postgres-four-way.sha256"
          fi
          exit "$status"

      - name: Upload four-way evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-postgres-four-way-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/postgres-postgres-four-way.json
            ${{ runner.temp }}/postgres-postgres-four-way.sha256
            ${{ runner.temp }}/raw-jdbc-dependency-tree.txt
            ${{ runner.temp }}/spring-dependency-tree.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes

      - name: Fail if campaign failed
        if: steps.campaign.outcome != 'success'
        run: |
          echo "::error::four-way campaign failed; inspect retained artifact"
          exit 1
