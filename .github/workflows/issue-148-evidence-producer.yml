name: Temporary #148 evidence producer

on:
  push:
    branches:
      - issue-148-payment-reconciliation-scaffold

permissions:
  contents: read

concurrency:
  group: issue-148-evidence-producer
  cancel-in-progress: true

jobs:
  produce:
    if: github.repository == 'luceat-lux-vestra/oxide-batch-workloads'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      DATABASE_URL: postgresql://oxide_batch_workload:oxide_batch_workload@127.0.0.1:5436/payment_reconciliation_workload
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out exact branch producer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: payment-reconciliation-postgres

      - name: Produce canonical #148 evidence
        working-directory: payment-reconciliation-postgres
        run: ./evidence/produce.sh

      - name: Upload rustfmt patch when producer source is not formatted
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payment-reconciliation-rustfmt-patch
          path: ${{ runner.temp }}/payment-reconciliation-rustfmt.patch
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload generated retained-evidence candidate
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payment-reconciliation-retained-evidence
          path: payment-reconciliation-postgres/validation
          if-no-files-found: error
          retention-days: 7
