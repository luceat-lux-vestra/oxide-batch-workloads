name: Campaign 93 scratch CI

on:
  push:
    branches: [campaign-93-lockgen]
    paths:
      - postgres-local-partition/**
      - .github/workflows/campaign-93-scratch-ci.yml

permissions:
  contents: read

concurrency:
  group: campaign-93-scratch
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out scratch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate PR1 semantic path
        run: bash postgres-local-partition/ci/validate ci
