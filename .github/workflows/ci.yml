name: CI

# Every trigger here is unconditional (no `paths`/`paths-ignore`): the
# stable merge-authority contexts below (`workloads-ci`, `workloads-msrv`,
# `supply-chain`) must always be producible on every relevant PR so they
# remain valid branch protection inputs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Diff-scoped dependency review remains an independent semantic authority.
  # The previous separate workflow is consolidated to avoid remote status polling.
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        if: github.event.pull_request.draft == false
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # Knows only the canonical registry and how to validate/discover it, plus
  # repository-wide provenance/evidence policy. Never knows a workload's
  # business logic.
  discover:
    name: discover
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      workloads: ${{ steps.discover.outputs.workloads }}
      msrv-workloads: ${{ steps.discover-msrv.outputs.workloads }}
      supply-chain-workloads: ${{ steps.discover-supply-chain.outputs.workloads }}
      jberet_clean: ${{ steps.qualification-scope.outputs.jberet_clean }}
      jberet_crash: ${{ steps.qualification-scope.outputs.jberet_crash }}
      pr4_semantic: ${{ steps.qualification-scope.outputs.pr4_semantic }}
      governance: ${{ steps.qualification-scope.outputs.governance }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test PR qualification scope classifier
        run: python3 .github/scripts/test-detect-pr-qualification-scope.py

      - name: Classify PR qualification scopes
        id: qualification-scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          write_all() {
            local value="$1"
            {
              echo "jberet_clean=$value"
              echo "jberet_crash=$value"
              echo "pr4_semantic=$value"
              echo "governance=$value"
            } >> "$GITHUB_OUTPUT"
          }

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            write_all false
            exit 0
          fi

          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::missing immutable PR base/head SHA; enabling every qualification scope"
            write_all true
            exit 0
          fi

          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            echo "::warning::PR base/head commit unavailable locally; enabling every qualification scope"
            write_all true
            exit 0
          fi

          changed="$RUNNER_TEMP/pr-qualification-changed-files.txt"
          if ! git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$changed"; then
            echo "::warning::unable to classify PR diff; enabling every qualification scope"
            write_all true
            exit 0
          fi

          python3 .github/scripts/detect-pr-qualification-scope.py \
            --files-from "$changed" \
            --github-output "$GITHUB_OUTPUT"

      - name: Test fail-closed workload registry validation
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test-workload-registry.py

      - name: Validate canonical workload registry
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/validate-workload-registry.py

      - name: Validate GitHub Actions semantics and trust boundaries
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: bash .github/scripts/check-actions-security.sh

      - name: Test OxideBatch provenance enforcement
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test-oxidebatch-provenance.py

      - name: Validate exact published OxideBatch provenance
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/validate-oxidebatch-provenance.py

      - name: Test canonical evidence contract
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test-evidence.py

      - name: Validate retained workload evidence
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/validate-evidence.py

      - name: Test fail-closed CodeQL SARIF verification
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/release-codeql-verdict.py --self-test

      - name: Test exact-SHA CodeQL reuse, join, dispatch and fail-closed behavior
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 tools/ci/release_codeql_preflight.py --self-test

      - name: Test future publisher CodeQL policy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 tools/ci/verify_release_codeql_policy.py --self-test

      - name: Require CodeQL publication-order policy
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 tools/ci/verify_release_codeql_policy.py

      - name: Test aggregate verdict logic
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test_aggregate_verdict.py

      - name: Test shard-result normalization
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test_write_shard_result.py

      - name: Test declared-MSRV execution projection
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test-discover-msrv-workloads.py

      - name: Test undeclared-MSRV evidence synthesis
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test-synthesize-msrv-not-applicable.py

      - name: Test supply-chain discovery projection
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test-discover-supply-chain-workloads.py

      - name: Test consolidated supply-chain authority
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test-run-supply-chain-authority.py

      - name: Discover workload fan-out matrix
        id: discover
        run: |
          matrix=$(python3 .github/scripts/discover-workloads.py)
          echo "workloads=$matrix" >> "$GITHUB_OUTPUT"

      - name: Discover declared-MSRV execution matrix
        id: discover-msrv
        run: |
          matrix=$(python3 .github/scripts/discover-msrv-workloads.py)
          echo "workloads=$matrix" >> "$GITHUB_OUTPUT"

      - name: Discover supply-chain authority matrix
        id: discover-supply-chain
        run: |
          matrix=$(python3 .github/scripts/discover-supply-chain-workloads.py)
          echo "workloads=$matrix" >> "$GITHUB_OUTPUT"

      - name: Test cargo-deny installer failure semantics
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: bash .github/scripts/test-install-cargo-deny.sh

      - name: Install verified cargo-deny 0.20.2
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: bash .github/scripts/install-cargo-deny.sh

      - name: Test supply-chain validator
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test-validate-supply-chain.py

      - name: Test supply-chain policy fixtures
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test-supply-chain-policy.py

  # Fans out over every registered workload and invokes its own `ci/validate
  # ci` contract. Knows nothing about what that contract does.
  ci-shard:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Explicit name (not the GitHub-Actions-default matrix suffix, which
    # stringifies non-primitive matrix values as the literal "Object"):
    # guarantees the job display name is exactly `ci-shard (<workload>)`, the
    # pattern workloads-ci's Jobs-API cross-check parses.
    name: ci-shard (${{ matrix.name }})
    needs: discover
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.workloads) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup ARM Java 25 for PostgreSQL/Java workload
        if: ${{ matrix.name == 'postgres-postgres' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # latest stable snapshot
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ matrix.path }}
          cache-targets: ${{ matrix.name != 'csv-postgres' }}

      - name: Resolve exact protected trusted base for Final compiler cache
        if: matrix.name == 'csv-postgres'
        id: final-trusted-base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          repo_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY")"
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$DEFAULT_BRANCH" \
            '.full_name == $repo and .default_branch == $branch' \
            <<<"$repo_json" >/dev/null
          base_sha="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/branches/$DEFAULT_BRANCH" --jq '.commit.sha')"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "trusted protected-main SHA: $base_sha"

      - name: Resolve exact Final compiler-cache identity
        if: matrix.name == 'csv-postgres'
        id: final-cache-id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.final-trusted-base.outputs.base_sha }}
          CARGO_INCREMENTAL: "0"
          SCCACHE_VERSION: "0.18.0"
          COMPILE_SURFACE: csv-postgres-final-ci-v1
        run: |
          set -euo pipefail
          lock_payload="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/contents/csv-postgres/Cargo.lock?ref=$BASE_SHA" \
            --jq '.content')"
          lock_hash="$(printf '%s' "$lock_payload" | tr -d '\n' | base64 --decode | sha256sum | awk '{print $1}')"
          env_hash="$(
            {
              rustc -Vv
              cargo -V
              printf 'runner_os=%s\n' "$RUNNER_OS"
              printf 'runner_arch=%s\n' "$RUNNER_ARCH"
              printf 'cargo_term_color=%s\n' "$CARGO_TERM_COLOR"
              printf 'cargo_incremental=%s\n' "$CARGO_INCREMENTAL"
              printf 'sccache_version=%s\n' "$SCCACHE_VERSION"
              printf 'compile_surface=%s\n' "$COMPILE_SURFACE"
            } | sha256sum | awk '{print $1}'
          )"
          [[ "$lock_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$env_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          key="workloads-final-csv-postgres-sccache-v1-linux-arm64-$env_hash-$lock_hash-$BASE_SHA"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "lock_prefix=workloads-final-csv-postgres-sccache-v1-linux-arm64-$env_hash-$lock_hash-" >> "$GITHUB_OUTPUT"
          echo "trusted Final compiler-cache key: $key"

      - name: Restore exact protected-main Final compiler cache
        if: matrix.name == 'csv-postgres'
        id: restore-final-sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/workloads-final-csv-postgres-sccache
          key: ${{ steps.final-cache-id.outputs.key }}
          restore-keys: |
            ${{ steps.final-cache-id.outputs.lock_prefix }}

      - name: Verify native ARM64 sccache 0.18.0 for Final even on cold cache
        if: matrix.name == 'csv-postgres'
        shell: bash
        env:
          SCCACHE_VERSION: "0.18.0"
          SCCACHE_SHA256: 2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          archive="$RUNNER_TEMP/sccache-v$SCCACHE_VERSION-aarch64-unknown-linux-musl.tar.gz"
          install_dir="$RUNNER_TEMP/sccache-v$SCCACHE_VERSION"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/mozilla/sccache/releases/download/v$SCCACHE_VERSION/sccache-v$SCCACHE_VERSION-aarch64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "$SCCACHE_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          test -x "$install_dir/sccache"
          test "$("$install_dir/sccache" --version)" = "sccache 0.18.0"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Enable restore-only Final compiler cache on compatible main cache
        if: matrix.name == 'csv-postgres' && steps.restore-final-sccache.outputs.cache-matched-key != ''
        id: enable-final-sccache
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CARGO_INCREMENTAL=0"
            echo "SCCACHE_DIR=$RUNNER_TEMP/workloads-final-csv-postgres-sccache"
            echo "SCCACHE_LOCAL_RW_MODE=READ_ONLY"
            echo "RUSTC_WRAPPER=sccache"
          } >> "$GITHUB_ENV"
          echo "compatible protected-main Final compiler cache restored (read-only)"

      - name: Final compiler-cache miss fallback
        if: matrix.name == 'csv-postgres' && steps.restore-final-sccache.outputs.cache-matched-key == ''
        run: echo "No compatible protected-main Final compiler cache; continuing with the canonical uncached Final contract."

      - name: Zero Final compiler-cache stats
        if: matrix.name == 'csv-postgres' && steps.enable-final-sccache.outcome == 'success'
        run: sccache --zero-stats

      - name: Run workload CI contract
        id: contract
        working-directory: ${{ matrix.path }}
        run: |
          set +e
          ./ci/validate ci
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Verify restore-only Final compiler-cache health
        if: ${{ always() && matrix.name == 'csv-postgres' && steps.enable-final-sccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          stats="$RUNNER_TEMP/workloads-final-csv-postgres-sccache-stats.json"
          sccache --show-stats --stats-format=json | tee "$stats"
          python3 - "$stats" <<'PY'
          import json
          import sys

          stats = json.load(open(sys.argv[1], encoding="utf-8")).get("stats", {})
          rust_hits = stats.get("cache_hits", {}).get("counts", {}).get("Rust", 0)
          rust_misses = stats.get("cache_misses", {}).get("counts", {}).get("Rust", 0)
          read_errors = stats.get("cache_read_errors", 0)
          write_errors = stats.get("cache_write_errors", 0)
          successful_writes = stats.get("cache_writes", 0)

          print(
              f"consumer rust_hits={rust_hits} rust_misses={rust_misses} "
              f"read_errors={read_errors} write_errors={write_errors} "
              f"successful_writes={successful_writes}"
          )
          # sccache 0.18.0 records an intentional rejected cache-store operation
          # for each cache miss in READ_ONLY mode. It is not a cache read failure.
          # Fail closed if misses/rejections diverge, reads fail, or any write succeeds.
          if read_errors != 0:
              raise SystemExit("restore-only Final compiler-cache consumer recorded cache read errors")
          if write_errors != rust_misses:
              raise SystemExit(
                  f"restore-only Final compiler-cache rejected-write count mismatch: "
                  f"write_errors={write_errors}, rust_misses={rust_misses}"
              )
          if successful_writes != 0:
              raise SystemExit("restore-only Final compiler-cache consumer wrote cache entries")
          if rust_hits <= 0:
              raise SystemExit("restore-only Final compiler-cache consumer produced no useful Rust hits")
          PY

      - name: Stop Final compiler-cache server
        if: ${{ always() && matrix.name == 'csv-postgres' && steps.enable-final-sccache.outcome == 'success' }}
        shell: bash
        run: sccache --stop-server || true

      - name: Record shard result
        if: always()
        env:
          WORKLOAD_NAME: ${{ matrix.name }}
          CONTRACT_EXIT_CODE: ${{ steps.contract.outputs.exit_code }}
        run: |
          python3 .github/scripts/write-shard-result.py \
            --workload "$WORKLOAD_NAME" \
            --stage ci \
            --exit-code "$CONTRACT_EXIT_CODE" \
            --out "${{ runner.temp }}/result.json"

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-ci-${{ matrix.name }}
          path: ${{ runner.temp }}/result.json
          retention-days: 7

      - name: Fail shard job if contract failed
        if: steps.contract.outputs.exit_code != '0'
        run: exit 1

  # Fans out only over entries whose validated registry policy declares an
  # actual MSRV. Undeclared entries remain part of the full aggregate
  # expectation and receive explicit not-applicable evidence in workloads-msrv.
  msrv-shard:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: msrv-shard (${{ matrix.name }})
    needs: discover
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.msrv-workloads) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install declared MSRV toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # latest stable snapshot; explicit toolchain input below overrides the default
        with:
          toolchain: ${{ matrix.msrv.version }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ matrix.path }}

      - name: Run workload MSRV contract
        id: contract
        working-directory: ${{ matrix.path }}
        run: |
          set +e
          ./ci/validate msrv
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Record declared-MSRV shard result
        if: always()
        env:
          WORKLOAD_NAME: ${{ matrix.name }}
          CONTRACT_EXIT_CODE: ${{ steps.contract.outputs.exit_code }}
        run: |
          python3 .github/scripts/write-shard-result.py \
            --workload "$WORKLOAD_NAME" \
            --stage msrv \
            --exit-code "$CONTRACT_EXIT_CODE" \
            --out "${{ runner.temp }}/result.json"

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-msrv-${{ matrix.name }}
          path: ${{ runner.temp }}/result.json
          retention-days: 7

      - name: Fail shard job if MSRV contract failed
        if: steps.contract.outputs.exit_code != '0'
        run: exit 1

  # Stable, required aggregate context. Computes its verdict with the same
  # testable script exercised by discover's "Test aggregate verdict logic"
  # step above -- never opaque GitHub expressions.
  workloads-ci:
    name: workloads-ci
    needs: [discover, ci-shard]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "exhaustive workload validation is deferred until the pull request is ready for review"

      - name: Check out repository
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download shard results
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.discover.result == 'success') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-ci-*
          path: ${{ runner.temp }}/results
          merge-multiple: false

      # The aggregate verdict uses exact shard artifacts and needs.<stage>-shard.result.
      # The Jobs API supplies optional diagnostics only; do not make it a gate.

      - name: Compute aggregate verdict
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (always()) }}
        env:
          DISCOVER_JSON: ${{ needs.discover.outputs.workloads }}
          DISCOVERY_OK: ${{ needs.discover.result == 'success' }}
          UPSTREAM_JOB_OK: ${{ needs.ci-shard.result == 'success' }}
        run: |
          python3 .github/scripts/aggregate_verdict.py \
            --stage ci \
            --discover-json "$DISCOVER_JSON" \
            --results-dir "${{ runner.temp }}/results" \
            --discovery-ok "$DISCOVERY_OK" \
            --upstream-job-ok "$UPSTREAM_JOB_OK"

  workloads-msrv:
    name: workloads-msrv
    needs: [discover, msrv-shard]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out repository
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download shard results
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.discover.result == 'success') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-msrv-*
          path: ${{ runner.temp }}/results
          merge-multiple: false

      # Downloaded artifacts cover declared-MSRV executions only. Materialize
      # explicit N/A evidence for every undeclared registry entry before the
      # unchanged full-registry aggregate verdict runs.
      - name: Synthesize explicit undeclared-MSRV dispositions
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.discover.result == 'success') }}
        env:
          DISCOVER_JSON: ${{ needs.discover.outputs.workloads }}
        run: |
          python3 .github/scripts/synthesize-msrv-not-applicable.py \
            --discover-json "$DISCOVER_JSON" \
            --results-dir "${{ runner.temp }}/results"

      # The aggregate verdict uses the full canonical discovery set, exact
      # declared-MSRV shard artifacts, and synthesized undeclared N/A evidence.
      # The Jobs API supplies optional diagnostics only; do not make it a gate.

      - name: Compute aggregate verdict
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (always()) }}
        env:
          DISCOVER_JSON: ${{ needs.discover.outputs.workloads }}
          DISCOVERY_OK: ${{ needs.discover.result == 'success' }}
          UPSTREAM_JOB_OK: ${{ needs.msrv-shard.result == 'success' }}
        run: |
          python3 .github/scripts/aggregate_verdict.py \
            --stage msrv \
            --discover-json "$DISCOVER_JSON" \
            --results-dir "${{ runner.temp }}/results" \
            --discovery-ok "$DISCOVERY_OK" \
            --upstream-job-ok "$UPSTREAM_JOB_OK"

  # Stable repository-wide supply-chain authority (#32). Discovery projects
  # only real workloads; this single runner independently cross-checks that
  # projection against the canonical registry before validating every workload.
  # dependency-review remains a separate diff-scoped authority.
  supply-chain:
    name: supply-chain
    needs: discover
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified cargo-deny 0.20.2
        run: bash .github/scripts/install-cargo-deny.sh

      - name: Validate every registered real workload
        env:
          DISCOVER_JSON: ${{ needs.discover.outputs.supply-chain-workloads }}
        run: |
          python3 .github/scripts/run-supply-chain-authority.py \
            --discover-json "$DISCOVER_JSON"

  # Path-scoped qualification authorities execute inside the canonical PR DAG.
  # Scope classification is fail-closed: an unclassifiable PR enables every lane.
  jberet-clean-qualification:
    name: JBeret clean qualification
    needs: discover
    if: ${{ needs.discover.outputs.jberet_clean == 'true' }}
    uses: $/.github/workflows/jberet-clean.yml

  jberet-crash-qualification:
    name: JBeret crash/restart qualification
    needs: discover
    if: ${{ needs.discover.outputs.jberet_crash == 'true' }}
    uses: $/.github/workflows/jberet-crash.yml

  pr4-semantic-qualification:
    name: PR4 four-way semantic gate
    needs: discover
    if: ${{ needs.discover.outputs.pr4_semantic == 'true' }}
    uses: $/.github/workflows/pr4-four-way-semantic.yml

  repository-governance-policy:
    name: Repository governance policy
    needs: discover
    if: ${{ needs.discover.outputs.governance == 'true' }}
    uses: $/.github/workflows/hardening-drift-audit-policy.yml

  # All semantic authorities run in this PR DAG. CI/MSRV shard aggregates
  # enforce exact identity/full coverage; supply-chain independently verifies
  # canonical real-workload completeness before scanning every workload.
  merge-gate:
    name: Merge Gate
    needs:
      - discover
      - ci-shard
      - msrv-shard
      - workloads-ci
      - workloads-msrv
      - supply-chain
      - dependency-review
      - jberet-clean-qualification
      - jberet-crash-qualification
      - pr4-semantic-qualification
      - repository-governance-policy
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every applicable authority to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          event = os.environ["GITHUB_EVENT_NAME"]
          always_required = {
              "discover", "ci-shard", "msrv-shard",
              "workloads-ci", "workloads-msrv", "supply-chain",
          }
          scope_outputs = needs.get("discover", {}).get("outputs", {})
          scoped = {
              "jberet-clean-qualification": scope_outputs.get("jberet_clean"),
              "jberet-crash-qualification": scope_outputs.get("jberet_crash"),
              "pr4-semantic-qualification": scope_outputs.get("pr4_semantic"),
              "repository-governance-policy": scope_outputs.get("governance"),
          }
          expected = always_required | {"dependency-review"} | set(scoped)
          errors = []
          if set(needs) != expected:
              errors.append(f"unexpected/missing DAG jobs: expected={sorted(expected)}, observed={sorted(needs)}")
          if event == "pull_request" and os.environ.get("PR_DRAFT") == "true":
              errors.append("draft pull request has not received complete semantic validation")

          for name in sorted(always_required):
              result = needs.get(name, {}).get("result")
              if result != "success":
                  errors.append(f"{name}: expected success, observed {result!r}")

          for name, enabled in sorted(scoped.items()):
              if enabled not in {"true", "false"}:
                  errors.append(f"{name}: invalid or missing scope classification {enabled!r}")
                  continue
              expected_result = "success" if enabled == "true" else "skipped"
              result = needs.get(name, {}).get("result")
              if result != expected_result:
                  errors.append(
                      f"{name}: scope={enabled}, expected {expected_result}, observed {result!r}"
                  )

          dependency_result = needs.get("dependency-review", {}).get("result")
          expected_dependency = "success" if event == "pull_request" else "skipped"
          if event not in {"pull_request", "workflow_dispatch"}:
              errors.append(f"unexpected CI event: {event!r}")
          if dependency_result != expected_dependency:
              errors.append(
                  f"dependency-review: expected {expected_dependency} on {event}, "
                  f"observed {dependency_result!r}"
              )

          if errors:
              for reason in errors:
                  print(f"::error::{reason}")
              sys.exit(1)
          print("Merge Gate: every applicable dependency and semantic aggregate succeeded")
          PY
