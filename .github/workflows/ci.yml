name: CI

# Every trigger here is unconditional (no `paths`/`paths-ignore`): the
# stable aggregate contexts below (`workloads-ci`, `workloads-msrv`,
# `supply-chain`) must always be producible on every relevant PR so they
# remain valid branch protection required contexts.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch: {}

permissions:
  actions: read # Needed to inspect the canonical exact-SHA Fast workflow run.
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Knows only the canonical registry and how to validate/discover it, plus
  # repository-wide provenance/evidence policy. Never knows a workload's
  # business logic.
  discover:
    name: discover
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      workloads: ${{ steps.discover.outputs.workloads }}
      supply-chain-workloads: ${{ steps.discover-supply-chain.outputs.workloads }}
    steps:
      - name: Resolve exact-SHA Fast evidence
        id: fast-evidence
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_JOB: fast
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$SAME_REPOSITORY" != "true" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Fork PR has no trusted base-repository Fast run; Final executes the full local validation."
            exit 0
          fi

          base_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/fast-branch.yml?ref=$BASE_SHA" --jq '.sha')"
          head_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/fast-branch.yml?ref=$EXPECTED_SHA" --jq '.sha')"
          if [ "$base_workflow_sha" != "$head_workflow_sha" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Fast producer workflow changed on this PR; Final will execute the local registry checks instead of trusting self-modified evidence."
            exit 0
          fi

          for _ in $(seq 1 60); do
            runs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/workflows/fast-branch.yml/runs?event=push&head_sha=$EXPECTED_SHA&per_page=100")"
            latest="$(jq -c --arg sha "$EXPECTED_SHA" '
              [.workflow_runs[]
               | select(.head_sha == $sha and .event == "push")]
              | if length == 0 then empty else max_by(.id) end
            ' <<<"$runs")"
            if [ -z "$latest" ]; then sleep 5; continue; fi
            status="$(jq -r '.status' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
            if [ "$status" != "completed" ]; then sleep 5; continue; fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::Canonical Fast workflow for exact HEAD $EXPECTED_SHA concluded '$conclusion'; classify/remediate it before Final."
              exit 1
            fi
            run_id="$(jq -r '.id' <<<"$latest")"
            jobs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100")"
            matching_jobs="$(jq --arg name "$EXPECTED_JOB" '[.jobs[] | select(.name == $name)] | length' <<<"$jobs")"
            if [ "$matching_jobs" != "1" ]; then
              echo "::error::Canonical Fast run $run_id must contain exactly one '$EXPECTED_JOB' job; found $matching_jobs."
              exit 1
            fi
            job_status="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | .status' <<<"$jobs")"
            job_conclusion="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | (.conclusion // "")' <<<"$jobs")"
            if [ "$job_status" != "completed" ] || [ "$job_conclusion" != "success" ]; then
              echo "::error::Canonical Fast job for exact HEAD $EXPECTED_SHA is not completed/success (status=$job_status conclusion=$job_conclusion)."
              exit 1
            fi
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing canonical successful Fast evidence for exact HEAD $EXPECTED_SHA."
            exit 0
          done
          echo "::error::Timed out waiting for canonical exact-SHA Fast evidence at $EXPECTED_SHA."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test fail-closed workload registry validation
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && steps.fast-evidence.outputs.reuse != 'true' }}
        run: python3 .github/scripts/test-workload-registry.py

      - name: Validate canonical workload registry
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && steps.fast-evidence.outputs.reuse != 'true' }}
        run: python3 .github/scripts/validate-workload-registry.py

      - name: Validate GitHub Actions semantics and trust boundaries
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: bash .github/scripts/check-actions-security.sh

      - name: Test OxideBatch provenance enforcement
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test-oxidebatch-provenance.py

      - name: Validate exact published OxideBatch provenance
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/validate-oxidebatch-provenance.py

      - name: Test canonical evidence contract
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test-evidence.py

      - name: Validate retained workload evidence
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/validate-evidence.py

      - name: Test aggregate verdict logic
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test_aggregate_verdict.py

      - name: Test shard-result normalization
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test_write_shard_result.py

      - name: Test supply-chain discovery projection
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test-discover-supply-chain-workloads.py

      - name: Discover workload fan-out matrix
        id: discover
        run: |
          matrix=$(python3 .github/scripts/discover-workloads.py)
          echo "workloads=$matrix" >> "$GITHUB_OUTPUT"

      - name: Discover supply-chain fan-out matrix
        id: discover-supply-chain
        run: |
          matrix=$(python3 .github/scripts/discover-supply-chain-workloads.py)
          echo "workloads=$matrix" >> "$GITHUB_OUTPUT"

      - name: Test cargo-deny installer failure semantics
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: bash .github/scripts/test-install-cargo-deny.sh

      - name: Install verified cargo-deny 0.20.2
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: bash .github/scripts/install-cargo-deny.sh

      - name: Test supply-chain validator
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test-validate-supply-chain.py

      - name: Test supply-chain policy fixtures
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        run: python3 .github/scripts/test-supply-chain-policy.py

  # Fans out over every registered workload and invokes its own `ci/validate
  # ci` contract. Knows nothing about what that contract does.
  ci-shard:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Explicit name (not the GitHub-Actions-default matrix suffix, which
    # stringifies non-primitive matrix values as the literal "Object"):
    # guarantees the job display name is exactly `ci-shard (<workload>)`, the
    # pattern workloads-ci's Jobs-API cross-check parses.
    name: ci-shard (${{ matrix.name }})
    needs: discover
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.workloads) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup ARM Java 25 for PostgreSQL/Java workload
        if: ${{ matrix.name == 'postgres-postgres' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # latest stable snapshot
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.path }}
          cache-targets: ${{ matrix.name != 'csv-postgres' }}

      - name: Resolve exact protected trusted base for Final compiler cache
        if: matrix.name == 'csv-postgres'
        id: final-trusted-base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          repo_json="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY")"
          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$DEFAULT_BRANCH" \
            '.full_name == $repo and .default_branch == $branch' \
            <<<"$repo_json" >/dev/null
          base_sha="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/branches/$DEFAULT_BRANCH" --jq '.commit.sha')"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "trusted protected-main SHA: $base_sha"

      - name: Resolve exact Final compiler-cache identity
        if: matrix.name == 'csv-postgres'
        id: final-cache-id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.final-trusted-base.outputs.base_sha }}
          CARGO_INCREMENTAL: "0"
          SCCACHE_VERSION: "0.18.0"
          COMPILE_SURFACE: csv-postgres-final-ci-v1
        run: |
          set -euo pipefail
          lock_payload="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/contents/csv-postgres/Cargo.lock?ref=$BASE_SHA" \
            --jq '.content')"
          lock_hash="$(printf '%s' "$lock_payload" | tr -d '\n' | base64 --decode | sha256sum | awk '{print $1}')"
          env_hash="$(
            {
              rustc -Vv
              cargo -V
              printf 'runner_os=%s\n' "$RUNNER_OS"
              printf 'runner_arch=%s\n' "$RUNNER_ARCH"
              printf 'cargo_term_color=%s\n' "$CARGO_TERM_COLOR"
              printf 'cargo_incremental=%s\n' "$CARGO_INCREMENTAL"
              printf 'sccache_version=%s\n' "$SCCACHE_VERSION"
              printf 'compile_surface=%s\n' "$COMPILE_SURFACE"
            } | sha256sum | awk '{print $1}'
          )"
          [[ "$lock_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$env_hash" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          key="workloads-final-csv-postgres-sccache-v1-linux-arm64-$env_hash-$lock_hash-$BASE_SHA"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "trusted Final compiler-cache key: $key"

      - name: Restore exact protected-main Final compiler cache
        if: matrix.name == 'csv-postgres'
        id: restore-final-sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/workloads-final-csv-postgres-sccache
          key: ${{ steps.final-cache-id.outputs.key }}

      - name: Verify native ARM64 sccache 0.18.0 for Final even on cold cache
        if: matrix.name == 'csv-postgres'
        shell: bash
        env:
          SCCACHE_VERSION: "0.18.0"
          SCCACHE_SHA256: 2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          archive="$RUNNER_TEMP/sccache-v$SCCACHE_VERSION-aarch64-unknown-linux-musl.tar.gz"
          install_dir="$RUNNER_TEMP/sccache-v$SCCACHE_VERSION"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/mozilla/sccache/releases/download/v$SCCACHE_VERSION/sccache-v$SCCACHE_VERSION-aarch64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          echo "$SCCACHE_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          test -x "$install_dir/sccache"
          test "$("$install_dir/sccache" --version)" = "sccache 0.18.0"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Enable restore-only Final compiler cache on exact hit
        if: matrix.name == 'csv-postgres' && steps.restore-final-sccache.outputs.cache-hit == 'true'
        id: enable-final-sccache
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CARGO_INCREMENTAL=0"
            echo "SCCACHE_DIR=$RUNNER_TEMP/workloads-final-csv-postgres-sccache"
            echo "SCCACHE_LOCAL_RW_MODE=READ_ONLY"
            echo "RUSTC_WRAPPER=sccache"
          } >> "$GITHUB_ENV"
          echo "exact protected-main Final compiler cache hit: true"

      - name: Final compiler-cache miss fallback
        if: matrix.name == 'csv-postgres' && steps.restore-final-sccache.outputs.cache-hit != 'true'
        run: echo "No exact protected-main Final compiler cache; continuing with the canonical uncached Final contract."

      - name: Zero Final compiler-cache stats
        if: matrix.name == 'csv-postgres' && steps.enable-final-sccache.outcome == 'success'
        run: sccache --zero-stats

      - name: Run workload CI contract
        id: contract
        working-directory: ${{ matrix.path }}
        run: |
          set +e
          ./ci/validate ci
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Verify restore-only Final compiler-cache health
        if: ${{ always() && matrix.name == 'csv-postgres' && steps.enable-final-sccache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          stats="$RUNNER_TEMP/workloads-final-csv-postgres-sccache-stats.json"
          sccache --show-stats --stats-format=json | tee "$stats"
          python3 - "$stats" <<'PY'
          import json
          import sys

          stats = json.load(open(sys.argv[1], encoding="utf-8")).get("stats", {})
          rust_hits = stats.get("cache_hits", {}).get("counts", {}).get("Rust", 0)
          rust_misses = stats.get("cache_misses", {}).get("counts", {}).get("Rust", 0)
          read_errors = stats.get("cache_read_errors", 0)
          write_errors = stats.get("cache_write_errors", 0)
          successful_writes = stats.get("cache_writes", 0)

          print(
              f"consumer rust_hits={rust_hits} rust_misses={rust_misses} "
              f"read_errors={read_errors} write_errors={write_errors} "
              f"successful_writes={successful_writes}"
          )
          if read_errors != 0 or write_errors != 0:
              raise SystemExit("restore-only Final compiler-cache consumer recorded cache I/O errors")
          if successful_writes != 0:
              raise SystemExit("restore-only Final compiler-cache consumer wrote cache entries")
          if rust_hits <= 0:
              raise SystemExit("restore-only Final compiler-cache consumer produced no useful Rust hits")
          PY

      - name: Stop Final compiler-cache server
        if: ${{ always() && matrix.name == 'csv-postgres' && steps.enable-final-sccache.outcome == 'success' }}
        shell: bash
        run: sccache --stop-server || true

      - name: Record shard result
        if: always()
        env:
          WORKLOAD_NAME: ${{ matrix.name }}
          CONTRACT_EXIT_CODE: ${{ steps.contract.outputs.exit_code }}
        run: |
          python3 .github/scripts/write-shard-result.py \
            --workload "$WORKLOAD_NAME" \
            --stage ci \
            --exit-code "$CONTRACT_EXIT_CODE" \
            --out "${{ runner.temp }}/result.json"

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: result-ci-${{ matrix.name }}
          path: ${{ runner.temp }}/result.json
          retention-days: 7

      - name: Fail shard job if contract failed
        if: steps.contract.outputs.exit_code != '0'
        run: exit 1

  # Fans out over every registered workload. The toolchain *version* comes
  # from registry data (matrix.msrv.version); the boolean branch is on
  # registry-declared policy, never on a workload name.
  msrv-shard:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: msrv-shard (${{ matrix.name }})
    needs: discover
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.workloads) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install declared MSRV toolchain
        if: matrix.msrv.declared
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # latest stable snapshot; explicit toolchain input below overrides the default
        with:
          toolchain: ${{ matrix.msrv.version }}

      - name: Cache Rust build
        if: matrix.msrv.declared
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.path }}

      - name: Run workload MSRV contract
        id: contract
        if: matrix.msrv.declared
        working-directory: ${{ matrix.path }}
        run: |
          set +e
          ./ci/validate msrv
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Record declared-MSRV shard result
        if: always() && matrix.msrv.declared
        env:
          WORKLOAD_NAME: ${{ matrix.name }}
          CONTRACT_EXIT_CODE: ${{ steps.contract.outputs.exit_code }}
        run: |
          python3 .github/scripts/write-shard-result.py \
            --workload "$WORKLOAD_NAME" \
            --stage msrv \
            --exit-code "$CONTRACT_EXIT_CODE" \
            --out "${{ runner.temp }}/result.json"

      - name: Record explicit not-applicable MSRV disposition
        if: always() && !matrix.msrv.declared
        env:
          WORKLOAD_NAME: ${{ matrix.name }}
          MSRV_POLICY_REASON: ${{ matrix.msrv.policy_reason }}
        run: |
          python3 .github/scripts/write-shard-result.py \
            --workload "$WORKLOAD_NAME" \
            --stage msrv \
            --not-applicable \
            --reason "$MSRV_POLICY_REASON" \
            --out "${{ runner.temp }}/result.json"

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: result-msrv-${{ matrix.name }}
          path: ${{ runner.temp }}/result.json
          retention-days: 7

      - name: Fail shard job if declared MSRV contract failed
        if: matrix.msrv.declared && steps.contract.outputs.exit_code != '0'
        run: exit 1

  # Fans out only over every registered REAL workload (workloads.json's
  # `workloads` array -- never `fixtures`, via discover's separate
  # supply-chain discovery projection). Invokes the repository-owned
  # validator, which is the only place that knows how to turn a registry
  # name into a cargo-deny invocation against root deny.toml. Contains no
  # workload-name conditionals: adding a second real workload to the
  # registry fans this job out automatically (see
  # test-discover-supply-chain-workloads.py).
  supply-chain-shard:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: supply-chain-shard (${{ matrix.name }})
    needs: discover
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.supply-chain-workloads) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified cargo-deny 0.20.2
        run: bash .github/scripts/install-cargo-deny.sh

      - name: Run supply-chain policy validator
        id: contract
        env:
          WORKLOAD_NAME: ${{ matrix.name }}
        run: |
          set +e
          python3 .github/scripts/validate-supply-chain.py --workload "$WORKLOAD_NAME"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Record shard result
        if: always()
        env:
          WORKLOAD_NAME: ${{ matrix.name }}
          CONTRACT_EXIT_CODE: ${{ steps.contract.outputs.exit_code }}
        run: |
          python3 .github/scripts/write-shard-result.py \
            --workload "$WORKLOAD_NAME" \
            --stage supply-chain \
            --exit-code "$CONTRACT_EXIT_CODE" \
            --out "${{ runner.temp }}/result.json"

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: result-supply-chain-${{ matrix.name }}
          path: ${{ runner.temp }}/result.json
          retention-days: 7

      - name: Fail shard job if supply-chain policy check failed
        if: steps.contract.outputs.exit_code != '0'
        run: exit 1

  # Stable, required aggregate context. Computes its verdict with the same
  # testable script exercised by discover's "Test aggregate verdict logic"
  # step above -- never opaque GitHub expressions.
  workloads-ci:
    name: workloads-ci
    needs: [discover, ci-shard]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Draft final-gate placeholder
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: echo "exhaustive workload validation is deferred until the pull request is ready for review"

      - name: Check out repository
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download shard results
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.discover.result == 'success') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: result-ci-*
          path: ${{ runner.temp }}/results
          merge-multiple: false

      - name: Fetch shard job conclusions
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.discover.result == 'success') }}
        id: jobs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.actions.listJobsForWorkflowRunAttempt({
              owner: context.repo.owner,
              repo: context.repo.repo,
