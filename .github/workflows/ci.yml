name: CI

# Every trigger here is unconditional (no `paths`/`paths-ignore`): the
# stable aggregate contexts below (`workloads-ci`, `workloads-msrv`) must
# always be producible on every relevant PR so they remain valid branch
# protection required contexts.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Knows only the canonical registry and how to validate/discover it, plus
  # repository-wide (not per-workload) dependency-provenance enforcement
  # (#29). Never knows a workload's business logic.
  discover:
    name: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      workloads: ${{ steps.discover.outputs.workloads }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test fail-closed workload registry validation
        run: python3 .github/scripts/test-workload-registry.py

      - name: Validate canonical workload registry
        run: python3 .github/scripts/validate-workload-registry.py

      - name: Test OxideBatch provenance enforcement
        run: python3 .github/scripts/test-oxidebatch-provenance.py

      - name: Validate exact published OxideBatch provenance
        run: python3 .github/scripts/validate-oxidebatch-provenance.py

      - name: Test aggregate verdict logic
        run: python3 .github/scripts/test_aggregate_verdict.py

      - name: Test shard-result normalization
        run: python3 .github/scripts/test_write_shard_result.py

      - name: Discover workload fan-out matrix
        id: discover
        run: |
          matrix=$(python3 .github/scripts/discover-workloads.py)
          echo "workloads=$matrix" >> "$GITHUB_OUTPUT"

  # Fans out over every registered workload and invokes its own `ci/validate
  # ci` contract. Knows nothing about what that contract does.
  ci-shard:
    # Explicit name (not the GitHub-Actions-default matrix suffix, which
    # stringifies non-primitive matrix values as the literal "Object"):
    # guarantees the job display name is exactly `ci-shard (<workload>)`, the
    # pattern workloads-ci's Jobs-API cross-check parses.
    name: ci-shard (${{ matrix.name }})
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.workloads) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.path }}

      - name: Run workload CI contract
        id: contract
        working-directory: ${{ matrix.path }}
        run: |
          set +e
          ./ci/validate ci
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Record shard result
        if: always()
        run: |
          python3 .github/scripts/write-shard-result.py \
            --workload "${{ matrix.name }}" \
            --stage ci \
            --exit-code "${{ steps.contract.outputs.exit_code }}" \
            --out "${{ runner.temp }}/result.json"

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result-ci-${{ matrix.name }}
          path: ${{ runner.temp }}/result.json
          retention-days: 7

      - name: Fail shard job if contract failed
        if: steps.contract.outputs.exit_code != '0'
        run: exit 1

  # Fans out over every registered workload. The toolchain *version* comes
  # from registry data (matrix.msrv.version); the boolean branch is on
  # registry-declared policy, never on a workload name.
  msrv-shard:
    name: msrv-shard (${{ matrix.name }})
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.workloads) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install declared MSRV toolchain
        if: matrix.msrv.declared
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable snapshot; explicit toolchain input below overrides the default
        with:
          toolchain: ${{ matrix.msrv.version }}

      - name: Cache Rust build
        if: matrix.msrv.declared
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.path }}

      - name: Run workload MSRV contract
        id: contract
        if: matrix.msrv.declared
        working-directory: ${{ matrix.path }}
        run: |
          set +e
          ./ci/validate msrv
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Record declared-MSRV shard result
        if: always() && matrix.msrv.declared
        run: |
          python3 .github/scripts/write-shard-result.py \
            --workload "${{ matrix.name }}" \
            --stage msrv \
            --exit-code "${{ steps.contract.outputs.exit_code }}" \
            --out "${{ runner.temp }}/result.json"

      - name: Record explicit not-applicable MSRV disposition
        if: always() && !matrix.msrv.declared
        run: |
          python3 .github/scripts/write-shard-result.py \
            --workload "${{ matrix.name }}" \
            --stage msrv \
            --not-applicable \
            --reason "${{ matrix.msrv.policy_reason }}" \
            --out "${{ runner.temp }}/result.json"

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result-msrv-${{ matrix.name }}
          path: ${{ runner.temp }}/result.json
          retention-days: 7

      - name: Fail shard job if declared MSRV contract failed
        if: matrix.msrv.declared && steps.contract.outputs.exit_code != '0'
        run: exit 1

  # Stable, required aggregate context. Computes its verdict with the same
  # testable script exercised by discover's "Test aggregate verdict logic"
  # step above -- never opaque GitHub expressions.
  workloads-ci:
    name: workloads-ci
    needs: [discover, ci-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download shard results
        if: needs.discover.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: result-ci-*
          path: ${{ runner.temp }}/results
          merge-multiple: false

      - name: Fetch shard job conclusions
        if: needs.discover.result == 'success'
        id: jobs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { data } = await github.rest.actions.listJobsForWorkflowRunAttempt({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              attempt_number: process.env.GITHUB_RUN_ATTEMPT,
              per_page: 100,
            });
            const statuses = {};
            for (const job of data.jobs) {
              const match = job.name.match(/^ci-shard \((.+)\)$/);
              if (match) {
                statuses[match[1]] = job.conclusion ?? job.status;
              }
            }
            return statuses;
          result-encoding: json

      - name: Compute aggregate verdict
        if: always()
        run: |
          python3 .github/scripts/aggregate_verdict.py \
            --stage ci \
            --discover-json '${{ needs.discover.outputs.workloads }}' \
            --results-dir "${{ runner.temp }}/results" \
            --discovery-ok "${{ needs.discover.result == 'success' }}" \
            --upstream-job-ok "${{ needs.ci-shard.result == 'success' }}" \
            --job-statuses-json '${{ steps.jobs.outputs.result || '{}' }}'

  workloads-msrv:
    name: workloads-msrv
    needs: [discover, msrv-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download shard results
        if: needs.discover.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: result-msrv-*
          path: ${{ runner.temp }}/results
          merge-multiple: false

      - name: Fetch shard job conclusions
        if: needs.discover.result == 'success'
        id: jobs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { data } = await github.rest.actions.listJobsForWorkflowRunAttempt({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              attempt_number: process.env.GITHUB_RUN_ATTEMPT,
              per_page: 100,
            });
            const statuses = {};
            for (const job of data.jobs) {
              const match = job.name.match(/^msrv-shard \((.+)\)$/);
              if (match) {
                statuses[match[1]] = job.conclusion ?? job.status;
              }
            }
            return statuses;
          result-encoding: json

      - name: Compute aggregate verdict
        if: always()
        run: |
          python3 .github/scripts/aggregate_verdict.py \
            --stage msrv \
            --discover-json '${{ needs.discover.outputs.workloads }}' \
            --results-dir "${{ runner.temp }}/results" \
            --discovery-ok "${{ needs.discover.result == 'success' }}" \
            --upstream-job-ok "${{ needs.msrv-shard.result == 'success' }}" \
            --job-statuses-json '${{ steps.jobs.outputs.result || '{}' }}'

  # --- Legacy required-context compatibility shims -------------------------
  #
  # Live branch protection ("Protect main") still requires exactly `ci`,
  # `msrv`, and `dependency-review` today. #28's migration sequence is:
  #   (a) prove workloads-ci/workloads-msrv on real PRs while ci/msrv stay
  #       required; (b) independent strict review; (c) add the new contexts
  #       to the ruleset *alongside* the old ones; (d) read back; (e) only
  #       then remove ci/msrv from required_status_checks; (f) read back
  #       again. There must never be a window where a required context
  #       cannot be produced.
  #
  # These two jobs exist solely so `ci` and `msrv` keep being real,
  # producible contexts throughout that migration: each is a thin mirror of
  # its aggregate job's verdict, not a second implementation of anything.
  # Delete both once step (e) above has landed and been read back.
  ci:
    name: ci
    needs: workloads-ci
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Mirror workloads-ci verdict for the legacy required context
        run: |
          echo "This job exists only to keep the legacy 'ci' required context producible during the workloads-ci/workloads-msrv migration (see .github/WORKLOAD_CONTRACT.md)."
          [ "${{ needs.workloads-ci.result }}" = "success" ]

  msrv:
    name: msrv
    needs: workloads-msrv
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Mirror workloads-msrv verdict for the legacy required context
        run: |
          echo "This job exists only to keep the legacy 'msrv' required context producible during the workloads-ci/workloads-msrv migration (see .github/WORKLOAD_CONTRACT.md)."
          [ "${{ needs.workloads-msrv.result }}" = "success" ]
