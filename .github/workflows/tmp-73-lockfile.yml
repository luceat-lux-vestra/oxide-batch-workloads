name: Temporary PR73 minimal lockfile refresh

on:
  push:
    branches:
      - feat/73-raw-sqlx-paging

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # latest stable snapshot
        with:
          toolchain: stable

      - name: Restore base lock and resolve only the new workspace member
        shell: bash
        run: |
          set -euo pipefail
          git show 893740529d8477859b0f0b9870fe30e351f267c0:postgres-postgres/Cargo.lock > "$RUNNER_TEMP/base.lock"
          cp "$RUNNER_TEMP/base.lock" postgres-postgres/Cargo.lock
          cd postgres-postgres
          cargo metadata --format-version 1 >/dev/null

      - name: Reject unrelated package drift
        shell: bash
        run: |
          set -euo pipefail
          git diff -- postgres-postgres/Cargo.lock
          python3 - "$RUNNER_TEMP/base.lock" postgres-postgres/Cargo.lock <<'PY'
          import sys, tomllib
          from pathlib import Path

          def packages(path):
              data = tomllib.loads(Path(path).read_text())
              return {
                  (p["name"], p["version"], p.get("source")): p
                  for p in data.get("package", [])
              }

          base = packages(sys.argv[1])
          current = packages(sys.argv[2])
          added = set(current) - set(base)
          removed = set(base) - set(current)
          if removed:
              raise SystemExit(f"existing lock packages removed: {sorted(removed)}")
          if added != {("raw-sqlx", "0.1.0", None)}:
              raise SystemExit(f"unexpected lock packages added: {sorted(added)}")
          for key, old in base.items():
              if current[key] != old:
                  raise SystemExit(f"existing lock package changed: {key}")
          raw = current[("raw-sqlx", "0.1.0", None)]
          expected = {"anyhow", "clap", "futures-util", "sha2 0.11.0", "sqlx", "tokio"}
          if set(raw.get("dependencies", [])) != expected:
              raise SystemExit(f"unexpected raw-sqlx dependencies: {raw.get('dependencies')}")
          print("minimal lockfile delta verified")
          PY

      - name: Commit minimal lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add postgres-postgres/Cargo.lock
          git commit -m "build(postgres-postgres): minimally lock raw sqlx member"
          git push
