name: Temporary PR73 lockfile generation

on:
  push:
    branches:
      - feat/73-raw-sqlx-paging

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # latest stable snapshot
        with:
          toolchain: stable

      - name: Generate workspace lockfile
        working-directory: postgres-postgres
        run: cargo generate-lockfile

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- postgres-postgres/Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add postgres-postgres/Cargo.lock
          git commit -m "build(postgres-postgres): lock raw sqlx workspace member"
          git push
