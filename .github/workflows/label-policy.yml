name: Label policy

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/labels.json"
      - "workloads.json"
      - ".github/scripts/reconcile-labels.py"
      - ".github/scripts/test-reconcile-labels.py"
      - ".github/workflows/label-policy.yml"
      - ".github/workflows/label-automation.yml"
  push:
    branches: [main]
    paths:
      - ".github/labels.json"
      - "workloads.json"
      - ".github/scripts/reconcile-labels.py"
      - ".github/scripts/test-reconcile-labels.py"
      - ".github/workflows/label-policy.yml"
      - ".github/workflows/label-automation.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: label-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test label reconciliation policy
        run: python3 .github/scripts/test-reconcile-labels.py
