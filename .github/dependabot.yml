version: 2
updates:
  - package-ecosystem: cargo
    directory: /csv-postgres
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # A workload's OxideBatch version is its validation subject. Upgrading it
      # is a deliberate validation campaign, never routine dependency churn.
      - dependency-name: oxide-batch
      - dependency-name: oxide-batch-test
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies