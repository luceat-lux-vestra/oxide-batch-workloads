version: 2
updates:
  - package-ecosystem: cargo
    directory: /csv-postgres
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # A workload's first-party OxideBatch crates are its validation subject.
      # Advancing any oxide-batch* crate is a deliberate validation campaign,
      # never routine dependency churn.
      - dependency-name: "oxide-batch*"
    labels:
      - dependencies

  - package-ecosystem: maven
    directory: /postgres-postgres/benchmark/java
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # pgjdbc and Spring Batch are frozen comparison subjects for campaign
      # #79. Advancing either is a deliberate benchmark-contract change, not
      # routine dependency churn.
      - dependency-name: "org.postgresql:postgresql"
      - dependency-name: "org.springframework.batch:spring-batch-core"
      # JBeret 3.2.0.Final qualification freezes CDI 4.1.0 with the reviewed
      # Java-SE runtime graph. A CDI major upgrade is a benchmark-contract
      # migration (including its CDI implementation), not routine maintenance.
      # Security updates remain independently eligible.
      - dependency-name: "jakarta.enterprise:jakarta.enterprise.cdi-api"
        update-types:
          - "version-update:semver-major"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
