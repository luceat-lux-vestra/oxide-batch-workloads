version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /csv-postgres
      - /payment-reconciliation-postgres
      - /payment-recovery-postgres
      - /postgres-local-partition
      - /postgres-postgres
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # Published first-party validation subjects advance only by explicit campaign.
      - dependency-name: "oxide-batch*"
    labels:
      - dependencies

  - package-ecosystem: cargo
    directories:
      - /fixture-heterogeneous
    schedule:
      interval: weekly
      day: monday
      time: "09:10"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: maven
    directory: /postgres-postgres/benchmark/java
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # pgjdbc and Spring Batch are frozen comparison subjects for campaign
      # #79. Advancing either is a deliberate benchmark-contract change, not
      # routine dependency churn.
      - dependency-name: "org.postgresql:postgresql"
      - dependency-name: "org.springframework.batch:spring-batch-core"
      # Maven Enforcer is pinned by the fail-closed Java benchmark/build-policy
      # contract. Version changes require deliberate policy requalification.
      - dependency-name: "org.apache.maven.plugins:maven-enforcer-plugin"
      # JBeret 3.2.0.Final qualification freezes CDI 4.1.0 with the reviewed
      # Java-SE runtime graph. A CDI major upgrade is a benchmark-contract
      # migration (including its CDI implementation), not routine maintenance.
      # Security updates remain independently eligible.
      - dependency-name: "jakarta.enterprise:jakarta.enterprise.cdi-api"
        update-types:
          - "version-update:semver-major"
    labels:
      - dependencies

  - package-ecosystem: cargo
    directories:
      - /payment-reference
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: maven
    directories:
      - /payment-reference/adapters/killbill-payment-sandbox
    schedule:
      interval: weekly
      day: monday
      time: "09:25"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    ignore:
      # Provider parent and API are qualified with the deployed Kill Bill release.
      - dependency-name: "org.kill-bill.*:*"
    labels:
      - dependencies

  - package-ecosystem: gomod
    directories:
      - /.github/tools/actionlint
    schedule:
      interval: weekly
      day: monday
      time: "09:35"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: docker
    directories:
      - /payment-reference/deploy/fault-proxy
      - /payment-reference/deploy/gateway
      - /payment-reference/deploy/killbill-db
      - /payment-reference/deploy/merchant
      - /payment-reference/deploy/payment-sandbox
    schedule:
      interval: weekly
      day: monday
      time: "09:40"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /payment-reference/deploy/killbill
    schedule:
      interval: weekly
      day: monday
      time: "09:42"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    ignore:
      # Provider application, DDL source and plugin ABI advance together.
      - dependency-name: "killbill/killbill"
    labels:
      - dependencies

  - package-ecosystem: docker-compose
    directories:
      - /csv-postgres
      - /payment-reconciliation-postgres
      - /payment-recovery-postgres
      - /payment-reference/deploy
      - /postgres-local-partition
      - /postgres-postgres
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
